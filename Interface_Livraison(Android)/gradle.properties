# Paramètres Gradle du projet.
# Mémoire allouée au démon Gradle.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Bibliothèques AndroidX (obligatoire pour Material, AppCompat, etc.).
android.useAndroidX=true
# Chaque bibliothèque a sa propre classe R (build plus rapide).
android.nonTransitiveRClass=true
